services:
  - type: web
    name: controle-financeiro-saas-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: controle_financeiro_v2_staging
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TRIAL_DAYS
        value: 3
      - key: PLAN_MONTHLY_PRICE
        value: 19.90
      - key: PLAN_SEMIANNUAL_PRICE
        value: 99.90
      - key: PLAN_YEARLY_PRICE
        value: 179.90
      - key: PIX_EXPIRATION_MINUTES
        value: 30
      - key: MERCADO_PAGO_ENV
        value: test
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_WEBHOOK_SECRET
        sync: false
