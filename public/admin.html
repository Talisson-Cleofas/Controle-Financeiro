<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parceiros — Controle Financeiro</title>
<style>body{margin:0;background:#0b0f17;color:#f8fafc;font:16px system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:28px}a{color:#a5b4fc}.card{background:#151b27;border:1px solid #273244;border-radius:18px;padding:20px;margin:18px 0}form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:grid;gap:6px;color:#cbd5e1}input{padding:12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:white}button{padding:11px 15px;border:0;border-radius:10px;background:#6d4aff;color:#fff;font-weight:700;cursor:pointer}.danger{background:#7f1d1d}.wide{grid-column:1/-1}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #273244}.muted{color:#94a3b8}.error{color:#fb7185}@media(max-width:720px){form{grid-template-columns:1fr}.wide{grid-column:auto}.scroll{overflow:auto}}</style><script src="./config.js"></script></head><body><main>
<p><a href="/">← Voltar ao Financeiro</a></p><h1>Licenças de parceiros</h1><p class="muted">Conceda acesso irrestrito a uma conta existente e acompanhe os cadastros e vendas do link de indicação.</p>
<section class="card"><h2>Conceder ou atualizar</h2><form id="form"><label>E-mail da conta<input id="email" type="email" required></label><label>Código de indicação<input id="code" maxlength="32" placeholder="MARIA10" required></label><label>Vencimento (opcional)<input id="expiresAt" type="date"></label><label>Desconto divulgado (%)<input id="discount" type="number" min="0" max="100" value="0"></label><label>Comissão (%)<input id="commission" type="number" min="0" max="100" value="0"></label><div class="wide"><button>Conceder licença</button> <span id="message"></span></div></form></section>
<section class="card"><h2>Parceiros</h2><div class="scroll"><table><thead><tr><th>Parceiro</th><th>Código/link</th><th>Acesso</th><th>Resultados</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main><script>
const token=()=>localStorage.getItem('cf_saas_token');const base=()=>String(window.APP_CONFIG?.API_URL||'').replace(/\/$/,'');
async function api(path,options={}){const response=await fetch(base()+path,{...options,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token(),...options.headers}});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||'Erro na operação.');return data}
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const {user}=await api('/api/auth/me');if(user.role!=='admin')throw new Error('Acesso exclusivo para administradores.');const {partners}=await api('/api/admin/partners');rows.innerHTML=partners.map(p=>`<tr><td><strong>${esc(p.name)}</strong><br><span class="muted">${esc(p.email)}</span></td><td><strong>${esc(p.code)}</strong><br><a href="${location.origin}/?ref=${encodeURIComponent(p.code)}" target="_blank">Abrir link</a></td><td>${p.active?'Ativo':'Inativo'}${p.expiresAt?'<br>até '+new Date(p.expiresAt).toLocaleDateString('pt-BR'):'<br>sem vencimento'}</td><td>${p.stats.registrations} cadastros<br>${p.stats.sales} vendas · R$ ${Number(p.stats.revenue).toFixed(2).replace('.',',')}<br>Comissão estimada: R$ ${Number(p.stats.estimatedCommission).toFixed(2).replace('.',',')}</td><td>${p.active?`<button class="danger" onclick="revoke('${p.id}')">Revogar</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Nenhum parceiro cadastrado.</td></tr>'}catch(error){document.querySelector('main').innerHTML='<h1>Acesso negado</h1><p class="error">'+esc(error.message)+'</p><p><a href="/">Voltar</a></p>'}}
form.onsubmit=async event=>{event.preventDefault();message.textContent='Salvando…';try{await api('/api/admin/partners',{method:'POST',body:JSON.stringify({email:email.value,code:code.value,expiresAt:expiresAt.value||null,discountPercent:Number(discount.value),commissionPercent:Number(commission.value)})});message.textContent='Licença concedida.';form.reset();discount.value=commission.value=0;await load()}catch(error){message.textContent=error.message}};
async function revoke(id){if(!confirm('Revogar o acesso irrestrito deste parceiro?'))return;await api('/api/admin/partners/'+id+'/revoke',{method:'POST'});await load()}load();
</script></body></html>
