<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Painel Administrativo</title><script src="./config.js"></script><style>body{font-family:Inter,Arial;background:#0b0f17;color:#fff;margin:0;padding:24px}.wrap{max-width:1250px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:22px 0}.card{background:#151b27;border:1px solid #273244;border-radius:18px;padding:20px}.card b{font-size:28px;display:block;margin-top:10px}.tabs{display:flex;gap:8px;margin:18px 0}table{width:100%;border-collapse:collapse;background:#151b27;border-radius:16px;overflow:hidden}th,td{text-align:left;padding:12px;border-bottom:1px solid #273244}button,select,input{padding:9px;border-radius:9px;border:1px solid #334155;background:#1e293b;color:white}.muted{color:#94a3b8}.toolbar{display:flex;gap:10px;margin-bottom:12px}.hide{display:none}.status{font-weight:800}.approved{color:#34d399}.pending{color:#fbbf24}@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}.table{overflow:auto}}</style></head><body><div class="wrap"><div class="top"><div><h1>Painel Administrativo</h1><p class="muted">Clientes, licenças, pagamentos Pix e receita.</p></div><div><a href="./vendas.html" style="color:#a5b4fc;margin-right:15px">Página de vendas</a><a href="./index.html" style="color:#a5b4fc">Voltar ao app</a></div></div><div class="cards"><div class="card">Usuários<b id="users">-</b></div><div class="card">Ativos<b id="active">-</b></div><div class="card">Em teste<b id="trial">-</b></div><div class="card">Vencidos<b id="pastDue">-</b></div><div class="card">Receita<b id="revenue">-</b></div></div><div class="tabs"><button onclick="show('customers')">Clientes</button><button onclick="show('payments')">Pagamentos</button></div><section id="customers"><div class="toolbar"><input id="search" placeholder="Buscar nome ou e-mail"><button onclick="loadUsers()">Buscar</button></div><div class="table"><table><thead><tr><th>Cliente</th><th>Plano</th><th>Status</th><th>Vencimento</th><th>Licença manual</th><th>Ação</th></tr></thead><tbody id="rows"></tbody></table></div></section><section id="payments" class="hide"><div class="table"><table><thead><tr><th>Cliente</th><th>Plano</th><th>Valor</th><th>Método</th><th>Status</th><th>Data</th></tr></thead><tbody id="payRows"></tbody></table></div></section></div><script>
const token=localStorage.getItem('cf_saas_token'),base=String(window.APP_CONFIG?.API_URL||'').replace(/\/$/,'');async function api(url,o={}){const r=await fetch(base+url,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...o.headers}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erro');return d}function brl(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function date(v){return v?new Date(v).toLocaleDateString('pt-BR'):'Sem vencimento'}
async function stats(){const s=await api('/api/admin/stats');users.textContent=s.users;active.textContent=s.active;trial.textContent=s.trial;pastDue.textContent=s.pastDue;revenue.textContent=brl(s.revenue)}
async function loadUsers(){const d=await api('/api/admin/users?q='+encodeURIComponent(search.value||''));rows.innerHTML=d.users.map(u=>`<tr><td><b>${u.name}</b><br><span class="muted">${u.email}</span></td><td>${u.plan}</td><td>${u.status}</td><td>${date(u.subscriptionEndsAt||u.trialEndsAt)}</td><td><select id="plan-${u._id}"><option value="monthly">Mensal</option><option value="semiannual">Semestral</option><option value="yearly">Anual</option><option value="lifetime">Vitalício</option></select> <button onclick="activate('${u._id}')">Ativar</button></td><td><select onchange="changeStatus('${u._id}',this.value)"><option value="">Alterar</option><option value="blocked">Bloquear</option><option value="trial">Teste</option><option value="cancelled">Cancelar</option></select></td></tr>`).join('')}
async function loadPayments(){const d=await api('/api/admin/payments');payRows.innerHTML=d.payments.map(p=>`<tr><td>${p.userId?.name||'-'}<br><span class="muted">${p.userId?.email||''}</span></td><td>${p.plan}</td><td>${brl(p.amount)}</td><td>${p.paymentMethod||'mercadopago'}</td><td class="status ${p.status}">${p.status}</td><td>${date(p.createdAt)}</td></tr>`).join('')}
async function activate(id){await api('/api/admin/users/'+id+'/activate',{method:'POST',body:JSON.stringify({plan:document.getElementById('plan-'+id).value,sendEmail:true})});await Promise.all([stats(),loadUsers()])}async function changeStatus(id,status){if(!status)return;await api('/api/admin/users/'+id,{method:'PATCH',body:JSON.stringify({status})});loadUsers()}function show(x){customers.classList.toggle('hide',x!=='customers');payments.classList.toggle('hide',x!=='payments');if(x==='payments')loadPayments()}Promise.all([stats(),loadUsers()]).catch(e=>{alert(e.message);location.href='./index.html'})
</script></body></html>
