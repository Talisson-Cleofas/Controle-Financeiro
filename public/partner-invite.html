<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ativar acesso de parceiro</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0f17;color:#f8fafc;font:16px system-ui,sans-serif;padding:20px}.box{width:min(440px,100%);box-sizing:border-box;background:#151b27;border:1px solid #273244;border-radius:22px;padding:26px}label{display:grid;gap:7px;margin:14px 0;color:#cbd5e1}input{padding:13px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff}button{width:100%;padding:13px;border:0;border-radius:10px;background:#6d4aff;color:#fff;font-weight:800}.muted{color:#94a3b8}.error{color:#fb7185}a{color:#a5b4fc}</style><script src="./config.js"></script></head><body><main class="box"><div style="font-size:34px">💰</div><h1>Ativar acesso de parceiro</h1><div id="loading" class="muted">Validando convite…</div><form id="form" hidden><p>Conta: <strong id="identity"></strong></p><p class="muted">Código de indicação: <strong id="code"></strong></p><label>Crie sua senha<input id="password" type="password" minlength="8" autocomplete="new-password" required></label><label>Confirme a senha<input id="confirmation" type="password" minlength="8" autocomplete="new-password" required></label><p id="message" class="error"></p><button>Ativar meu acesso</button></form></main><script>
const rawToken=new URLSearchParams(location.search).get('token')||'';const base=String(window.APP_CONFIG?.API_URL||'').replace(/\/$/,'');
async function api(path,body){const response=await fetch(base+path,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||'Erro na operação.');return data}
async function start(){try{const {invitation}=await api('/api/auth/partner-invite/inspect',{token:rawToken});identity.textContent=invitation.name+' ('+invitation.email+')';code.textContent=invitation.code;loading.hidden=true;form.hidden=false}catch(error){loading.className='error';loading.textContent=error.message}}
form.onsubmit=async event=>{event.preventDefault();message.textContent='';if(password.value!==confirmation.value){message.textContent='As senhas não são iguais.';return}try{const result=await api('/api/auth/partner-invite/accept',{token:rawToken,password:password.value});localStorage.setItem('cf_saas_token',result.token);history.replaceState({},'',location.pathname);location.href='/'}catch(error){message.textContent=error.message}};start();
</script></body></html>
