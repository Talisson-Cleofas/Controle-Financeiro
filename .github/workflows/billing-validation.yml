name: Billing validation

on:
  push:
    branches: [fix/billing-reliable-processing]
  pull_request:
    branches: [feat/comercial-saas-v2]

permissions:
  contents: read

concurrency:
  group: billing-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payments:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    env:
      MERCADO_PAGO_ACCESS_TOKEN: ''
      MONGODB_URI: ''
      SMTP_HOST: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Unit and integration tests with disposable MongoDB
        run: npm test
      - name: Check diff whitespace
        run: git diff --check
